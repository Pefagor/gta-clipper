# Основные настройки. Секреты (ключи) лежат в .env.
# То, что меняется кнопками в боте (чувствительность, лимиты публикаций, хэштеги),
# хранится в базе и здесь задаёт только значения по умолчанию.

data_dir: data

ffmpeg: auto          # auto = найти ffmpeg с поддержкой субтитров (libass); или полный путь
ffprobe: auto
streamlink: auto      # auto = streamlink из виртуального окружения программы; или полный путь

recording:
  quality: best
  segment_seconds: 4
  buffer_hours: 3
  stall_seconds: 240         # нет новых сегментов столько секунд -> перезапуск (рекламная пауза Twitch длится до 3 мин)
  live_check_seconds: 60
  streamlink_extra_args: []  # streamlink 8+ сам вырезает рекламу Twitch

detector:
  tick_seconds: 2
  window_seconds: 10
  baseline_seconds: 600
  warmup_seconds: 120
  reaction_delay: 10         # реакция чата отстаёт от момента
  pre_roll: 45
  post_roll: 30
  max_window: 90
  cooldown: 60
  thresholds: {low: 8.0, mid: 6.0, high: 4.5}   # чувствительность: меньше / средне / больше кандидатов
  weights: {chat: 2.0, audio: 1.5, emotes: 1.0}
  rage_db: 9.0              # крик громче обычного уровня стримера на столько дБ — момент даже без реакции чата
  rage_min_z: 2.5
  emotes: [KEKW, LUL, LULW, OMEGALUL, KEKL, ICANT, pepeLaugh, Pog, PogChamp, POGGERS, monkaS,
           WutFace, "💀", "😂", "🤣", "ахах", "хаха", "ору", "лол", "кек", "???", "клип", "clip"]

clips_poll_seconds: 30

whisper:
  model: large-v3-turbo
  device: auto             # auto | cuda | cpu
  compute_type: auto       # auto: float16 на видеокарте (с откатом на int8), int8 на процессоре
  language: ru
  beam_size: 5

llm:
  base_url: https://routerai.ru/api/v1
  use_system_proxy: false    # true — ходить в routerai через системный прокси (HTTPS_PROXY)
  screen_model: anthropic/claude-haiku-5.5
  review_model: anthropic/claude-sonnet-5.5
  screen_threshold: 6
  timeout: 120
  # Цены в рублях за 1 млн токенов (вход, выход). Sonnet — с сайта routerai,
  # Haiku — оценка, уточните в личном кабинете.
  prices_rub:
    anthropic/claude-haiku-5.5: [10.7, 53.3]
    anthropic/claude-sonnet-5.5: [213, 1067]

render:
  width: 1080
  height: 1920
  fps: 30
  max_file_mb: 45            # лимит Telegram-бота на отправку файла — 50 МБ
  max_video_kbps: 8000
  encoder: auto              # auto | h264_nvenc | h264_videotoolbox | libx264
  font: Arial
  loudness_lufs: -14

compilation:
  min_clips: 3
  max_seconds: 90

cleanup:
  keep_clips_days: 7
  keep_rejected_days: 1
  min_free_gb: 20

defaults:                    # стартовые значения настроек бота
  sensitivity: mid
  per_day: 10
  interval_hours: 1.5
  publish_mode: schedule     # schedule | now
  hashtags: ""               # общие хэштеги для всех клипов; хэштеги игры — в разделе games ниже
  quiet: false
  api_daily_limit_rub: 0     # 0 = без лимита

# Игры: короткое название для заголовка Shorts («… | GTA 6») и хэштеги. Название — как категория на Twitch.
# Для игр, которых здесь нет, берётся название категории и хэштег из него (Dota 2 → #dota2).
games:
  "Grand Theft Auto VI": {short: "GTA 6", tags: "#gta6 #гта6"}
  "Grand Theft Auto V": {short: "GTA 5", tags: "#gta5 #гта5"}
  "Dota 2": {short: "Dota 2", tags: "#dota2 #дота2"}
  "Counter-Strike": {short: "CS2", tags: "#cs2 #кс2"}
  "Just Chatting": {short: "", tags: ""}
