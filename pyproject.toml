[project]
name = "gta-clipper"
version = "0.1.0"
description = "Автоматическая нарезка вертикальных клипов из стримов Twitch"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipper"]  # models/, tests/, data/ — не пакеты Python

[tool.pytest.ini_options]
testpaths = ["tests"]
